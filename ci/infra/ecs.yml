AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Thiup backend infrastructure: a Fargate ECS service whose ONLY ingress is a
  Cloudflare Tunnel (cloudflared sidecar, outbound-only connection; the tunnel
  ID — and therefore DNS — is independent of deploys and task IPs). No load
  balancer, no inbound security-group rules, no open ports. Uses the default
  VPC and an EXTERNAL PostgreSQL (no RDS created here). Only ONE backend
  secret (SecretKey); API_SECRET_KEY is derived from it at boot.

# Console display order/grouping for the create/update-stack form (without this,
# the console lists parameters alphabetically).
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Network" }
        Parameters: [VpcId, PublicSubnet1, PublicSubnet2]
      - Label: { default: "Image & scaling" }
        Parameters: [ImageRepoName, DesiredCount, TaskCpu, TaskMemory, MomentumScheduleExpression, PurgeScheduleExpression]
      - Label: { default: "Cloudflare Tunnel" }
        Parameters: [TunnelToken]
      - Label: { default: "Application config" }
        Parameters: [DebugValue, AllowedHosts, EncryptedResponse, SingleRequestProtect, GatewaySeed, InternalAdminUrl, CorsAllowedOrigins, CsrfTrustedOrigins, SecretKey]
      - Label: { default: "Captcha (Cap standalone)" }
        Parameters: [CaptchaProtect, CapPublicUrl, CapSiteKey, CapSecret, CapAdminKey]
      - Label: { default: "Object storage (S3 / Cloudflare R2)" }
        Parameters: [StorageBucketName, StoragePublicDomain, StorageEndpointUrl, StorageAccessKeyId, StorageSecretAccessKey]
      - Label: { default: "Database (external PostgreSQL)" }
        Parameters: [DatabaseHost, DatabaseName, DatabaseUser, DatabasePort, DatabasePassword]

# --- Parameters ---
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC id (e.g. vpc-xxxx).

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet of the default VPC. MUST be a different subnet (different AZ) than PublicSubnet2.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet, ideally in a DIFFERENT Availability Zone than PublicSubnet1 (lets tasks land in either AZ).

  ImageRepoName:
    Type: String
    Default: thiup-backend

  DesiredCount:
    Type: Number
    Default: 1

  MomentumScheduleExpression:
    Type: String
    Default: "rate(10 minutes)"
    Description: >
      How often the momentum recompute runs (EventBridge Scheduler). Default is
      every 10 minutes (each tick is a billed ephemeral Fargate task, so the
      cadence is a direct cost knob); FlexibleTimeWindow is OFF so it fires on
      time.

  # Smallest Fargate size (0.25 vCPU / 512 MB). The whole web app is ~50 MB PSS
  # with 1 gunicorn worker, so 512 MB leaves ample headroom; the task runs 24/7,
  # making its size the main ECS cost knob. Bump only with measured pressure.
  PurgeScheduleExpression:
    Type: String
    Default: "rate(2 days)"
    Description: >
      How often the garbage collector (purge_inactive) hard-deletes
      soft-deleted rows (EventBridge Scheduler -> ephemeral Fargate task,
      same pattern as momentum).

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048"]

  TaskMemory:
    Type: String
    Default: "512"

  # ---- App config (required at Django boot) ----
  DebugValue:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]

  AllowedHosts:
    Type: String
    Default: "*"
    Description: >
      Django ALLOWED_HOSTS. With tunnel-only ingress this can finally be
      tightened: set it to your API hostname PLUS 127.0.0.1 (the container
      health check hits http://127.0.0.1:8000/health/ — without it, Django
      400s the probe and ECS cycles the task). Example:
      api.tudominio.com,127.0.0.1,localhost. "*" also still works.

  EncryptedResponse:
    Type: String
    Default: "True"
    AllowedValues: ["True", "False"]

  SingleRequestProtect:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]

  GatewaySeed:
    Type: String
    Description: >
      REQUIRED. Gateway rotating-path seed; must match the frontend's
      REACT_APP_GATEWAY_SEED. PUBLIC obfuscation, not a secret — independent
      from SecretKey.

  InternalAdminUrl:
    Type: String
    AllowedPattern: "^(?!admin/).+/$"
    ConstraintDescription: Must end with "/" and must not be "admin/".
    Description: >
      Obfuscated path for the real Django admin. Must end with "/" and must NOT
      be "admin/" (that path is the honeypot). Use a non-predictable value, e.g.
      admin-Hk9_x2lT/ (generate: python -c "import secrets;print(f'admin-{secrets.token_urlsafe(6)}/')").

  CorsAllowedOrigins:
    Type: String
    AllowedPattern: ".+"
    ConstraintDescription: Required (stored in SSM, which rejects empty values).
    Description: >
      Comma-separated origins allowed to call the API from a browser. FULL URLs
      with scheme (and port if any), no trailing slash. Stored in SSM → must be
      non-empty. Example: https://thiup.com,https://www.thiup.com,http://localhost:3000

  CsrfTrustedOrigins:
    Type: String
    AllowedPattern: ".+"
    ConstraintDescription: Required (stored in SSM, which rejects empty values).
    Description: >
      Comma-separated origins trusted for cross-origin POSTs (e.g. admin login).
      FULL URLs with scheme, Django 4 matches EXACTLY. Stored in SSM → must be
      non-empty. Example: https://thiup.com,https://api.thiup.com,http://localhost:8080

  # ---- Object storage (S3-compatible: AWS S3 or Cloudflare R2) ----
  StorageBucketName:
    Type: String
    Description: Bucket/container name for static + media assets.
  StoragePublicDomain:
    Type: String
    Description: >
      Public domain serving the bucket (AWS_S3_CUSTOM_DOMAIN), no scheme. For R2,
      the r2.dev domain or a custom domain, e.g. assets.thiup.com
  StorageEndpointUrl:
    Type: String
    Description: >
      S3-compatible endpoint. For Cloudflare R2:
      https://<ACCOUNT_ID>.r2.cloudflarestorage.com (region is "auto").
  StorageAccessKeyId:
    Type: String
    NoEcho: true
    Description: Access key id for the storage provider (R2 API token).
  StorageSecretAccessKey:
    Type: String
    NoEcho: true
    Description: Secret access key for the storage provider (R2 API token).

  # Only ONE backend secret: API_SECRET_KEY is derived from SECRET_KEY at boot.
  SecretKey:
    Type: String
    NoEcho: true

  # Cloudflare Tunnel connector token (Zero Trust -> Networks -> Tunnels ->
  # the tunnel -> install commands; the long "eyJ..." string). The cloudflared
  # sidecar uses it to register as a connector — ingress then arrives through
  # the tunnel instead of the ALB. Treat it like a password: whoever holds it
  # can attach a connector to the tunnel's hostnames.
  TunnelToken:
    Type: String
    NoEcho: true
    AllowedPattern: ".+"
    ConstraintDescription: Required (the cloudflared sidecar cannot start without it).

  # ---- Captcha (Cap standalone, https://github.com/tiagozip/cap) ----
  # The FE widget solves an invisible proof-of-work against the Cap server;
  # Django only redeems tokens via siteverify and gates entity-creating
  # writes behind the resulting "human pass" (see CLAUDE.md, Captcha section).
  # The cap sidecar is ALWAYS part of the web task; CaptchaProtect (below)
  # is the only on/off switch, and it only governs Django-side enforcement.
  CaptchaProtect:
    Type: String
    Default: "True"
    AllowedValues: ["True", "False"]
    Description: >
      Django-side enforcement flag (CAPTCHA_PROTECT). Defaults to ON: every
      entity-creating write requires the human pass from day one — make sure
      the tunnel route, site key and CAP_PUBLIC_URL are real BEFORE deploying
      the FE, or all writes will 403. Stored in SSM — toggle there + force a
      new deployment, no stack update needed.

  CapPublicUrl:
    Type: String
    Default: "https://captcha.thiup.com/"
    Description: >
      Browser-facing base URL of the Cap server (dialed by visitors'
      browsers; exposed to the FE via /config/ as captcha_endpoint). The
      Cloudflare Tunnel route for this hostname must point at
      http://localhost:3333 (the cap sidecar). Editable later in SSM
      (/${stack}/CAP_PUBLIC_URL) without a stack update.

  CapSiteKey:
    Type: String
    AllowedPattern: ".+"
    ConstraintDescription: Required (stored in SSM, which rejects empty values).
    Description: >
      REQUIRED. Site key created in the Cap dashboard (public, ships to the
      browser). Chicken-and-egg on first deploy: the dashboard only exists
      AFTER the cap sidecar runs — pass any placeholder, create the key, then
      edit the SSM param /${stack}/CAP_SITE_KEY with the real value.

  CapSecret:
    Type: String
    NoEcho: true
    AllowedPattern: ".+"
    ConstraintDescription: Required (Secrets Manager rejects empty values).
    Description: >
      REQUIRED. Secret of the Cap site key (sk-...). Backend-only: Django
      uses it for the siteverify call. Same first-deploy note as CapSiteKey —
      placeholder first, then edit the secret /${stack}/CAP_SECRET.

  CapAdminKey:
    Type: String
    NoEcho: true
    AllowedPattern: ".{12,}"
    ConstraintDescription: Required, minimum 12 characters (cap refuses to boot with less).
    Description: >
      REQUIRED. Admin key of the Cap dashboard (min 12 chars). Use a strong
      random value — the dashboard is reachable through the public hostname.

  # ---- External database ---- (engine is hardcoded in the task def: always postgresql)
  DatabaseHost:
    Type: String

  DatabaseName:
    Type: String

  DatabaseUser:
    Type: String

  DatabasePassword:
    Type: String
    NoEcho: true

  DatabasePort:
    Type: String
    Default: "5432"

# --- Resources ---
Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-web"
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        # ECS uses the execution role to inject SSM params + Secrets Manager
        # secrets into the container at task launch.
        - PolicyName: read-config-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref SecretKeySecret
                  - !Ref DatabasePasswordSecret
                  - !Ref StorageAccessKeyIdSecret
                  - !Ref StorageSecretAccessKeySecret
                  - !Ref TunnelTokenSecret
                  - !Ref CapSecretSecret
                  - !Ref CapAdminKeySecret

  # Assets live in an external S3-compatible bucket (Cloudflare R2) reached with
  # access keys, so the task role needs no storage permissions.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # ---- Security group ----
  # NO ingress rules on purpose: the only way in is the Cloudflare Tunnel,
  # which the cloudflared sidecar opens OUTBOUND (default egress is open).
  # Nothing on the internet — or even inside the VPC — can dial the task.
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} service - no inbound (tunnel-only ingress)"
      VpcId: !Ref VpcId

  # ---- Config in SSM Parameter Store (editable in the AWS console) ----
  # Seeded from the stack parameters on create; afterwards edit the VALUES in
  # the SSM console (an unrelated stack update won't overwrite them). To apply a
  # change to the running app: force a new deployment (no build needed).
  ParamDebug:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/DEBUG", Type: String, Value: !Ref DebugValue }
  ParamAllowedHosts:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/ALLOWED_HOSTS", Type: String, Value: !Ref AllowedHosts }
  ParamEncryptedResponse:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/ENCRYPTED_RESPONSE", Type: String, Value: !Ref EncryptedResponse }
  ParamSingleRequestProtect:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/SINGLE_REQUEST_PROTECT", Type: String, Value: !Ref SingleRequestProtect }
  ParamGatewaySeed:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/GATEWAY_SEED", Type: String, Value: !Ref GatewaySeed }
  ParamInternalAdminUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/INTERNAL_ADMIN_URL", Type: String, Value: !Ref InternalAdminUrl }
  ParamDatabaseHost:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/DATABASE_HOST", Type: String, Value: !Ref DatabaseHost }
  ParamDatabaseName:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/DATABASE_NAME", Type: String, Value: !Ref DatabaseName }
  ParamDatabaseUser:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/DATABASE_USER", Type: String, Value: !Ref DatabaseUser }
  ParamDatabasePort:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/DATABASE_PORT", Type: String, Value: !Ref DatabasePort }
  # SSM forbids parameter names starting with "aws"/"ssm"; the SSM name drops the
  # AWS_ prefix but the injected env var (in the task def) keeps it.
  ParamStorageBucketName:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/STORAGE_BUCKET_NAME", Type: String, Value: !Ref StorageBucketName }
  ParamStoragePublicDomain:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/STORAGE_CUSTOM_DOMAIN", Type: String, Value: !Ref StoragePublicDomain }
  ParamStorageEndpointUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/STORAGE_ENDPOINT_URL", Type: String, Value: !Ref StorageEndpointUrl }
  # CORS/CSRF live in SSM too (console-editable). They must be NON-EMPTY (SSM
  # rejects empty strings) — set at least one origin.
  ParamCorsAllowedOrigins:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/CORS_ALLOWED_ORIGINS", Type: String, Value: !Ref CorsAllowedOrigins }
  ParamCsrfTrustedOrigins:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/CSRF_TRUSTED_ORIGINS", Type: String, Value: !Ref CsrfTrustedOrigins }
  # Captcha config (console-editable like the rest; SSM rejects empty
  # values, hence the required non-empty parameters above).
  ParamCaptchaProtect:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/CAPTCHA_PROTECT", Type: String, Value: !Ref CaptchaProtect }
  ParamCapSiteKey:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/CAP_SITE_KEY", Type: String, Value: !Ref CapSiteKey }
  ParamCapPublicUrl:
    Type: AWS::SSM::Parameter
    Properties: { Name: !Sub "/${AWS::StackName}/CAP_PUBLIC_URL", Type: String, Value: !Ref CapPublicUrl }

  # ---- Secrets in Secrets Manager (edit the value in the console) ----
  SecretKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/SECRET_KEY"
      SecretString: !Ref SecretKey
  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/DATABASE_PASSWORD"
      SecretString: !Ref DatabasePassword
  StorageAccessKeyIdSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/AWS_ACCESS_KEY_ID"
      SecretString: !Ref StorageAccessKeyId
  StorageSecretAccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/AWS_SECRET_ACCESS_KEY"
      SecretString: !Ref StorageSecretAccessKey
  TunnelTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/TUNNEL_TOKEN"
      SecretString: !Ref TunnelToken
  CapSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/CAP_SECRET"
      SecretString: !Ref CapSecret
  CapAdminKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/CAP_ADMIN_KEY"
      SecretString: !Ref CapAdminKey

  # ---- Cap's store: SELF-HOSTED valkey sidecar backed by EFS ----
  # Fargate tasks are ephemeral, but Cap's site keys live in this store: the
  # /data dir rides on EFS so the keys survive deploys and task replacement.
  # Sized for KBs of data — EFS cost is cents. The access point pins the
  # valkey user (uid/gid 999) so the container can write its RDB snapshots.
  CapStoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} cap store - NFS from the service tasks only"
      VpcId: !Ref VpcId
      # Ingress on the EFS mount targets, NOT on the tasks: the task SG
      # keeps its zero-inbound doctrine.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  CapStoreFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-cap-store" }

  CapStoreMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CapStoreFileSystem
      SubnetId: !Ref PublicSubnet1
      SecurityGroups: [!Ref CapStoreSecurityGroup]

  CapStoreMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CapStoreFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups: [!Ref CapStoreSecurityGroup]

  CapStoreAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref CapStoreFileSystem
      PosixUser: { Uid: "999", Gid: "999" }
      RootDirectory:
        Path: /valkey
        CreationInfo: { OwnerUid: "999", OwnerGid: "999", Permissions: "750" }

  # ---- Task definition ----
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - ParamDebug
      - ParamAllowedHosts
      - ParamEncryptedResponse
      - ParamSingleRequestProtect
      - ParamGatewaySeed
      - ParamInternalAdminUrl
      - ParamDatabaseHost
      - ParamDatabaseName
      - ParamDatabaseUser
      - ParamDatabasePort
      - ParamStorageBucketName
      - ParamStoragePublicDomain
      - ParamStorageEndpointUrl
      - ParamCorsAllowedOrigins
      - ParamCsrfTrustedOrigins
      - ParamCaptchaProtect
      - ParamCapSiteKey
      - ParamCapPublicUrl
    Properties:
      Family: !Sub "${AWS::StackName}-web"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      # EFS-backed volume for Cap's valkey store (site keys survive deploys).
      Volumes:
        - Name: cap-store
          EFSVolumeConfiguration:
            FilesystemId: !Ref CapStoreFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref CapStoreAccessPoint
      ContainerDefinitions:
        - Name: web
          # Bootstrap tag: the service starts on :latest (always present), then the
          # deploy pins it to an immutable :SHA revision. ImageTag is not a param.
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepoName}:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          # Container-level health check: the tunnel has no load balancer
          # probing /health/, so ECS itself must detect a wedged gunicorn
          # (the deployment circuit breaker consumes this signal too). The
          # slim image has no curl — urllib raises on any non-2xx.
          # StartPeriod covers Django boot AND the scheduled momentum runs:
          # their command override leaves no gunicorn listening, but those
          # tasks exit within seconds, long before failures count.
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          # Computed by the stack (not user-managed) + values that may be empty
          # (SSM String params can't be empty), so they stay inline.
          Environment:
            - { Name: SERVER_PORT,            Value: 8000 }
            # Neon requires SSL; libpq reads PGSSLMODE (Django leaves OPTIONS empty).
            - { Name: PGSSLMODE,              Value: require }
            - { Name: USE_AWS_STORAGE,        Value: "True" }
            # AWS_S3_REGION_NAME defaults to "auto" (R2) in settings; bucket /
            # domain / endpoint / keys come from SSM + Secrets Manager below.
            - { Name: DATABASE_ENGINE,        Value: django.db.backends.postgresql }
            # Cap sidecar topology (awsvpc: containers share localhost). Set
            # unconditionally — Django only dials it when CAPTCHA_PROTECT=True.
            - { Name: CAP_SITEVERIFY_URL,     Value: "http://127.0.0.1:3333" }
          # User-managed in the AWS console: SSM Parameter Store (config) +
          # Secrets Manager (secrets). Edit the value there, then redeploy.
          Secrets:
            - { Name: DEBUG,                  ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/DEBUG" }
            - { Name: ALLOWED_HOSTS,          ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/ALLOWED_HOSTS" }
            - { Name: CORS_ALLOWED_ORIGINS,   ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/CORS_ALLOWED_ORIGINS" }
            - { Name: CSRF_TRUSTED_ORIGINS,   ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/CSRF_TRUSTED_ORIGINS" }
            - { Name: ENCRYPTED_RESPONSE,     ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/ENCRYPTED_RESPONSE" }
            - { Name: SINGLE_REQUEST_PROTECT, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/SINGLE_REQUEST_PROTECT" }
            - { Name: GATEWAY_SEED,           ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/GATEWAY_SEED" }
            - { Name: INTERNAL_ADMIN_URL,     ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/INTERNAL_ADMIN_URL" }
            - { Name: DATABASE_HOST,          ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/DATABASE_HOST" }
            - { Name: DATABASE_NAME,          ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/DATABASE_NAME" }
            - { Name: DATABASE_USER,          ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/DATABASE_USER" }
            - { Name: DATABASE_PORT,          ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/DATABASE_PORT" }
            - { Name: AWS_STORAGE_BUCKET_NAME, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/STORAGE_BUCKET_NAME" }
            - { Name: AWS_S3_CUSTOM_DOMAIN,   ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/STORAGE_CUSTOM_DOMAIN" }
            - { Name: AWS_S3_ENDPOINT_URL,    ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/STORAGE_ENDPOINT_URL" }
            - { Name: SECRET_KEY,             ValueFrom: !Ref SecretKeySecret }
            - { Name: DATABASE_PASSWORD,      ValueFrom: !Ref DatabasePasswordSecret }
            - { Name: AWS_ACCESS_KEY_ID,      ValueFrom: !Ref StorageAccessKeyIdSecret }
            - { Name: AWS_SECRET_ACCESS_KEY,  ValueFrom: !Ref StorageSecretAccessKeySecret }
            # Captcha: enforcement flag + widget bootstrap (SSM, console-
            # editable) and the siteverify secret (Secrets Manager).
            - { Name: CAPTCHA_PROTECT,        ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/CAPTCHA_PROTECT" }
            - { Name: CAP_SITE_KEY,           ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/CAP_SITE_KEY" }
            - { Name: CAP_PUBLIC_URL,         ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/CAP_PUBLIC_URL" }
            - { Name: CAP_SECRET,             ValueFrom: !Ref CapSecretSecret }

        # Cloudflare Tunnel connector: opens an OUTBOUND-only connection to
        # Cloudflare's edge and forwards tunnel traffic to gunicorn over the
        # task-local loopback (awsvpc mode: containers in a task share
        # localhost). Ingress needs no open ports and no load balancer; the
        # tunnel hostname -> http://localhost:8000 mapping lives in the
        # Cloudflare Zero Trust dashboard, not here.
        - Name: cloudflared
          # Docker Hub is the only official source (no ECR Public mirror).
          # Unlike CodeBuild, each Fargate task pulls from its own fresh
          # public IP, so the anonymous per-IP pull limit is a non-issue.
          Image: docker.io/cloudflare/cloudflared:latest
          # Image entrypoint is "cloudflared --no-autoupdate"; the connector
          # token comes from the TUNNEL_TOKEN env var (kept out of process
          # args and task-definition JSON).
          Command: ["tunnel", "run"]
          # NOT essential, restarted on crash:
          #  - Essential false lets the ephemeral momentum task exit when its
          #    web container finishes (an essential sidecar would keep that
          #    task alive — and billing — forever).
          #  - RestartPolicy revives a crashed connector in place. Exit 0 is
          #    ignored so the momentum schedule's "version" override (see
          #    MomentumSchedule Input) runs once and stays down.
          Essential: false
          RestartPolicy:
            Enabled: true
            IgnoredExitCodes: [0]
          Secrets:
            - { Name: TUNNEL_TOKEN, ValueFrom: !Ref TunnelTokenSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cloudflared

        # Cap's SELF-HOSTED store: valkey with its /data on EFS (site keys
        # must survive deploys — Fargate storage is ephemeral). Persistence
        # knobs mirror the local compose service: RDB snapshot every 60 s,
        # never evict. NOT essential + restarted on crash, like cloudflared.
        - Name: valkey
          Image: docker.io/valkey/valkey:9-alpine
          Essential: false
          RestartPolicy:
            Enabled: true
            IgnoredExitCodes: [0]
          Command:
            - valkey-server
            - "--save"
            - "60"
            - "1"
            - "--loglevel"
            - warning
            - "--maxmemory-policy"
            - noeviction
          MountPoints:
            - SourceVolume: cap-store
              ContainerPath: /data
          # Lets cap order its start on a store that actually answers.
          HealthCheck:
            Command: [CMD, valkey-cli, ping]
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: valkey

        # Cap captcha standalone: serves challenge/redeem to the browser and
        # siteverify to Django, both over the task-local loopback. Public
        # ingress reuses the SAME tunnel connector — add a Zero Trust route:
        # <CapPublicUrl hostname> -> http://localhost:3333. Like cloudflared:
        # NOT essential (the ephemeral cron tasks must be able to exit) and
        # restarted on crash. NOTE: the ephemeral ticks also pull cap+valkey
        # and run them idle until the web command exits — harmless (nothing
        # routes to them there) but part of each tick's billed pull time.
        - Name: cap
          Image: docker.io/tiago2/cap:latest
          Essential: false
          RestartPolicy:
            Enabled: true
            IgnoredExitCodes: [0]
          # cap PINGs its store at boot and exits 1 if it isn't up yet.
          DependsOn:
            - ContainerName: valkey
              Condition: HEALTHY
          # Observability only (non-essential containers aren't acted on by
          # ECS when unhealthy): surfaces a wedged cap in the Containers tab
          # instead of burying it in logs. The image has no curl — bun probes
          # its own HTTP port.
          HealthCheck:
            Command:
              - CMD
              - bun
              - -e
              - "const r = await fetch('http://127.0.0.1:3333/'); if (!r.ok) process.exit(1);"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          Environment:
            # Cap's own listen-port knob; matches CAP_SITEVERIFY_URL above
            # and the tunnel route (localhost:3333).
            - { Name: SERVER_PORT, Value: 3333 }
            # Task-local store (awsvpc loopback). No auth on purpose: the
            # task SG has zero inbound — nothing outside the task can dial it.
            - { Name: REDIS_URL, Value: "redis://127.0.0.1:6379" }
          Secrets:
            - { Name: ADMIN_KEY, ValueFrom: !Ref CapAdminKeySecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cap

  # ---- ECS service (ingress via the Cloudflare Tunnel sidecar) ----
  Service:
    Type: AWS::ECS::Service
    Properties:
      # "-svc-v2": the original "-svc" was created ATTACHED to the ALB and
      # detaching it in place failed (the update kept the target-group wiring
      # while the SG closed -> ALB health checks timed out -> deployment
      # circuit breaker). A new ServiceName forces REPLACEMENT: CFN creates
      # this LB-free service first, then deletes the old one on cleanup.
      # Applied in two steps — see "ALB removal runbook" in ci/infra/README.md.
      ServiceName: !Sub "${AWS::StackName}-svc-v2"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # Auto-roll back a deploy that never becomes healthy. Health now comes
        # from the web container's own health check (task def), not an ALB.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets + public IP: EGRESS only (pull from ECR without a
          # NAT, reach the DB and Cloudflare's edge). Nothing dials in — the
          # security group has no ingress rules.
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup

  # ---- Momentum recompute: EventBridge Scheduler -> ephemeral Fargate task ----
  # Replaces the old Celery beat + RabbitMQ. Every 10 min the scheduler launches
  # a ONE-OFF task from the SAME task definition as the web service, overriding
  # the command to run `python manage.py recompute_momentum`. Because the image
  # tag is mutable (e.g. :test) and Fargate pulls the image fresh on every task
  # launch, each run uses the LATEST image pushed by CodeBuild — no extra wiring
  # needed for "always up to date". The task starts, computes, and exits.

  # Role EventBridge Scheduler assumes to run the task on the cluster.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-momentum-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # RunTask on any revision of this stack's web task-definition
              # family, scoped to this cluster.
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}-web:*"
                Condition:
                  ArnLike:
                    ecs:cluster: !GetAtt Cluster.Arn
              # The scheduler must pass the task's execution + task roles to ECS.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  MomentumSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-momentum"
      Description: Recompute For You momentum every 10 min (ephemeral Fargate task).
      ScheduleExpression: !Ref MomentumScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      # OFF = fire exactly on schedule (no jitter window) — punctual on every tick.
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # Idempotent command: a missed/failed tick is recovered by the next one,
        # so don't pile up retries.
        RetryPolicy:
          MaximumRetryAttempts: 0
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              # Public IP so the task can pull from ECR and reach the DB.
              AssignPublicIp: ENABLED
              Subnets:
                - !Ref PublicSubnet1
                - !Ref PublicSubnet2
              SecurityGroups:
                - !Ref ServiceSecurityGroup
        # Override gunicorn with the management command for this run only.
        # cloudflared is overridden to "version" (prints and exits 0): the
        # cron task must NOT register as a tunnel connector — with gunicorn
        # replaced by the management command, nothing listens on :8000 and
        # Cloudflare would route live traffic into it (502s). Exit 0 is in
        # the sidecar's RestartPolicy IgnoredExitCodes, so it stays down.
        Input: !Sub |
          {"containerOverrides":[{"name":"web","command":["python","manage.py","recompute_momentum"]},{"name":"cloudflared","command":["version"]}]}

  # ---- Garbage collector: same ephemeral pattern as momentum, every 2 days.
  # Hard-deletes rows soft-deleted >24h ago (opt-in model registry, 1000 rows
  # per run) — ThreadFile deletions also remove the object from storage.
  PurgeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-purge"
      Description: Hard-delete soft-deleted rows every 2 days (ephemeral Fargate task).
      ScheduleExpression: !Ref PurgeScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      # A one-hour flex window is fine here (unlike momentum, punctuality is
      # irrelevant for a GC) and lets the scheduler pick a cheap moment.
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 60
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # Idempotent: a missed run is recovered by the next one.
        RetryPolicy:
          MaximumRetryAttempts: 0
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets:
                - !Ref PublicSubnet1
                - !Ref PublicSubnet2
              SecurityGroups:
                - !Ref ServiceSecurityGroup
        # web runs the GC; cloudflared is neutralized like in every one-off
        # task (no gunicorn on :8000 -> must not join the tunnel).
        Input: !Sub |
          {"containerOverrides":[{"name":"web","command":["python","manage.py","purge_inactive"]},{"name":"cloudflared","command":["version"]}]}

  # ---- CI: CodeBuild project (build image -> collectstatic -> deploy) ----
  # CLUSTER/SERVICE are wired to THIS stack's resources, so they can never go
  # stale. The role carries every permission the buildspec needs (ECR, ECS
  # deploy + run-task, PassRole, logs, GitHub connection).
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-ci*"
              - Sid: EcrAuthToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepoName}"
              - Sid: EcsDeployAndRunTask
                Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RunTask
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              # automigrate reads the run-task's CloudWatch logs to parse `showmigrations`.
              - Sid: ReadTaskLogs
                Effect: Allow
                Action: [logs:GetLogEvents, logs:FilterLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AWS::StackName}-web:*"
              # deploy re-points the momentum + purge schedules at the freshly
              # deployed revision.
              - Sid: UpdateMomentumSchedule
                Effect: Allow
                Action: [scheduler:GetSchedule, scheduler:UpdateSchedule]
                Resource:
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-momentum"
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-purge"
              # update-schedule re-passes the scheduler's own role to EventBridge Scheduler.
              - Sid: PassSchedulerRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: Ec2DescribeForPublicIp
                Effect: Allow
                Action: ec2:DescribeNetworkInterfaces
                Resource: "*"
              # Needed at DOWNLOAD_SOURCE: CodeBuild gets a token from the GitHub
              # App connection to clone the repo. Resource "*" mirrors the
              # working manual role's `codebuild-github-connection` policy.
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codeconnections:GetConnectionToken
                  - codeconnections:UseConnection
                  - codestar-connections:GetConnectionToken
                  - codestar-connections:UseConnection
                Resource: "*"

  # The GitHub App credential + webhook are bound BY HAND in the console (the
  # account's SCP blocks PassConnection/CreateWebhook). The template only declares
  # the repo Location + buildspec.yml. See ci/infra/README.md.
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-ci"
      Description: Build the image, sync static to S3, and deploy to ECS.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:6.0
        ImagePullCredentialsType: CODEBUILD
        # Required to run `docker build` inside the build.
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref AWS::AccountId }
          - { Name: IMAGE_NAME,     Value: !Ref ImageRepoName }
          - { Name: IMAGE_TAG,      Value: latest }
          # Wired to this stack -> never stale.
          - { Name: CLUSTER,           Value: !Ref Cluster }
          - { Name: SERVICE,           Value: !GetAtt Service.Name }
          - { Name: MOMENTUM_SCHEDULE, Value: !Sub "${AWS::StackName}-momentum" }
          - { Name: PURGE_SCHEDULE,    Value: !Sub "${AWS::StackName}-purge" }
      Source:
        # GITHUB + BuildSpec: buildspec.yml so the build runs the repo's buildspec.
        # Location is required by CloudFormation for a GitHub source. The GitHub
        # App credential and the webhook are bound BY HAND in the console (the
        # account's SCP blocks PassConnection/CreateWebhook). See ci/infra/README.md.
        Type: GITHUB
        Location: "https://github.com/SirRiuz/thiup_backend.git"
        GitCloneDepth: 1
        BuildSpec: buildspec.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

# --- Outputs ---
Outputs:
  ClusterName:
    Description: Set this as CLUSTER in the CodeBuild project env.
    Value: !Ref Cluster

  ServiceName:
    Description: Set this as SERVICE in the CodeBuild project env.
    Value: !GetAtt Service.Name

  TunnelConsole:
    Description: >
      Ingress is a Cloudflare Tunnel — the public hostname -> localhost:8000
      routes live here (Zero Trust -> Networks -> Tunnels), not in AWS. The
      captcha needs a SECOND route on the same tunnel: the CapPublicUrl
      hostname -> http://localhost:3333 (the cap sidecar).
    Value: "https://one.dash.cloudflare.com/"

  MomentumScheduleName:
    Description: EventBridge schedule that runs recompute_momentum.
    Value: !Ref MomentumSchedule

  PurgeScheduleName:
    Description: EventBridge schedule that runs purge_inactive (garbage collector).
    Value: !Ref PurgeSchedule

  CodeBuildProjectName:
    Description: CodeBuild project for this stack's CI.
    Value: !Ref CodeBuildProject

  EnvConfigConsole:
    Description: >
      Edit/add/delete app CONFIG here (SSM Parameter Store). Filter by the stack
      name. Change a value, then force a new deployment (no build needed).
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/parameters/?region=${AWS::Region}"

  EnvSecretsConsole:
    Description: >
      Edit the SECRETS here (Secrets Manager): /${stack}/SECRET_KEY and
      /${stack}/DATABASE_PASSWORD. Change a value, then force a new deployment.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/secretsmanager/listsecrets?region=${AWS::Region}"
