AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Thiup backend infrastructure: a public Application Load Balancer in front of a
  Fargate ECS service. Internet -> ALB (stable DNS) -> Fargate task. Gives a
  fixed public URL (http://<alb-dns>) that does NOT change between deploys, so
  you can CNAME a Cloudflare subdomain to it. Uses the default VPC and an
  EXTERNAL PostgreSQL (no RDS created here). Only ONE backend secret (SecretKey);
  API_SECRET_KEY is derived from it at boot.

################################################################################
# Parameters                                                                   #
################################################################################
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC id (e.g. vpc-xxxx).

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet of the default VPC. MUST be a different subnet (different AZ) than PublicSubnet2.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet, in a DIFFERENT Availability Zone than PublicSubnet1. The ALB requires two AZs.

  ImageRepoName:
    Type: String
    Default: thiup-backend

  ImageTag:
    Type: String
    Default: test

  ContainerPort:
    Type: Number
    Default: 8000

  DesiredCount:
    Type: Number
    Default: 1

  MomentumScheduleExpression:
    Type: String
    Default: "rate(10 minutes)"
    Description: >
      How often the momentum recompute runs (EventBridge Scheduler). Default is
      every 10 minutes; FlexibleTimeWindow is OFF so it fires on time.

  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "512"

  # ---- App config (required at Django boot) ----
  StageValue:
    Type: String
    Default: prod

  DebugValue:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]

  AllowedHosts:
    Type: String
    Default: "*"
    Description: >
      Django ALLOWED_HOSTS. Keep "*" initially (ALB health checks send the task's
      private IP as Host; a narrow list 400s them). Later add your Cloudflare
      subdomain, e.g. api.tudominio.com.

  EncryptedResponse:
    Type: String
    Default: "True"
    AllowedValues: ["True", "False"]

  SingleRequestProtect:
    Type: String
    Default: "False"
    AllowedValues: ["True", "False"]

  GatewaySeed:
    Type: String
    Description: >
      REQUIRED. Gateway rotating-path seed; must match the frontend's
      REACT_APP_GATEWAY_SEED. PUBLIC obfuscation, not a secret — independent
      from SecretKey.

  InternalAdminUrl:
    Type: String
    AllowedPattern: "^(?!admin/).+/$"
    ConstraintDescription: Must end with "/" and must not be "admin/".

  MediaBaseUrl:
    Type: String
    Default: ""

  CorsAllowedOrigins:
    Type: String
    Default: ""

  CsrfTrustedOrigins:
    Type: String
    Default: ""

  # Only ONE backend secret: API_SECRET_KEY is derived from SECRET_KEY at boot.
  SecretKey:
    Type: String
    NoEcho: true

  # ---- External database ----
  DatabaseEngine:
    Type: String
    Default: django.db.backends.postgresql

  DatabaseHost:
    Type: String

  DatabaseName:
    Type: String

  DatabaseUser:
    Type: String

  DatabasePassword:
    Type: String
    NoEcho: true

  DatabasePort:
    Type: String
    Default: "5432"

################################################################################
# Resources                                                                    #
################################################################################
Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-web"
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        # The app + the deploy-time collectstatic task write/read assets in S3
        # (django-storages uses this role via the AWS credential chain).
        - PolicyName: s3-assets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${StaticBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StaticBucket.Arn

  # ---- S3 bucket for static (admin/swagger/DRF) + media assets ----
  # Public-read: the runtime container is gunicorn-only, so assets are served
  # from S3, not the app. (Thiup posts/media are public anyway.)
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-assets-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadAssets
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${StaticBucket.Arn}/*"

  # ---- Security groups ----
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} ALB - public HTTP"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} service - traffic from ALB only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB to container

  # ---- Application Load Balancer ----
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-tg"
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---- Task definition ----
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-web"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImageRepoName}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          Environment:
            - { Name: STAGE,                  Value: !Ref StageValue }
            - { Name: DEBUG,                  Value: !Ref DebugValue }
            - { Name: SERVER_PORT,            Value: !Ref ContainerPort }
            - { Name: ALLOWED_HOSTS,          Value: !Ref AllowedHosts }
            - { Name: ENCRYPTED_RESPONSE,     Value: !Ref EncryptedResponse }
            - { Name: SINGLE_REQUEST_PROTECT, Value: !Ref SingleRequestProtect }
            - { Name: GATEWAY_SEED,           Value: !Ref GatewaySeed }
            - { Name: INTERNAL_ADMIN_URL,     Value: !Ref InternalAdminUrl }
            - { Name: MEDIA_BASE_URL,         Value: !Ref MediaBaseUrl }
            - { Name: CORS_ALLOWED_ORIGINS,   Value: !Ref CorsAllowedOrigins }
            - { Name: CSRF_TRUSTED_ORIGINS,   Value: !Ref CsrfTrustedOrigins }
            - { Name: USE_AWS_STORAGE,        Value: "True" }
            - { Name: AWS_STORAGE_BUCKET_NAME, Value: !Ref StaticBucket }
            - { Name: AWS_S3_CUSTOM_DOMAIN,   Value: !Sub "${StaticBucket}.s3.${AWS::Region}.amazonaws.com" }
            - { Name: AWS_S3_REGION_NAME,     Value: !Ref AWS::Region }
            - { Name: SECRET_KEY,             Value: !Ref SecretKey }
            - { Name: DATABASE_ENGINE,        Value: !Ref DatabaseEngine }
            - { Name: DATABASE_HOST,          Value: !Ref DatabaseHost }
            - { Name: DATABASE_NAME,          Value: !Ref DatabaseName }
            - { Name: DATABASE_USER,          Value: !Ref DatabaseUser }
            - { Name: DATABASE_PASSWORD,      Value: !Ref DatabasePassword }
            - { Name: DATABASE_PORT,          Value: !Ref DatabasePort }

  # ---- ECS service (fronted by the ALB) ----
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${AWS::StackName}-svc"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # Give Django time to boot before unhealthy checks count against the task.
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # Auto-roll back a deploy that never becomes healthy.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets + public IP so the task can pull from ECR without a NAT.
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: web
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  # ---- Momentum recompute: EventBridge Scheduler -> ephemeral Fargate task ----
  # Replaces the old Celery beat + RabbitMQ. Every 10 min the scheduler launches
  # a ONE-OFF task from the SAME task definition as the web service, overriding
  # the command to run `python manage.py recompute_momentum`. Because the image
  # tag is mutable (e.g. :test) and Fargate pulls the image fresh on every task
  # launch, each run uses the LATEST image pushed by CodeBuild — no extra wiring
  # needed for "always up to date". The task starts, computes, and exits.

  # Role EventBridge Scheduler assumes to run the task on the cluster.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-momentum-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # RunTask on any revision of this stack's web task-definition
              # family, scoped to this cluster.
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}-web:*"
                Condition:
                  ArnLike:
                    ecs:cluster: !GetAtt Cluster.Arn
              # The scheduler must pass the task's execution + task roles to ECS.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

  MomentumSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-momentum"
      Description: Recompute For You momentum every 10 min (ephemeral Fargate task).
      ScheduleExpression: !Ref MomentumScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: ENABLED
      # OFF = fire exactly on schedule (no jitter window) — punctual every 10 min.
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        # Idempotent command: a missed/failed tick is recovered by the next one,
        # so don't pile up retries.
        RetryPolicy:
          MaximumRetryAttempts: 0
        EcsParameters:
          TaskDefinitionArn: !Ref TaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              # Public IP so the task can pull from ECR and reach the DB.
              AssignPublicIp: ENABLED
              Subnets:
                - !Ref PublicSubnet1
                - !Ref PublicSubnet2
              SecurityGroups:
                - !Ref ServiceSecurityGroup
        # Override gunicorn with the management command for this run only.
        Input: !Sub |
          {"containerOverrides":[{"name":"web","command":["python","manage.py","recompute_momentum"]}]}

################################################################################
# Outputs                                                                      #
################################################################################
Outputs:
  ClusterName:
    Description: Set this as CLUSTER in the CodeBuild project env.
    Value: !Ref Cluster

  ServiceName:
    Description: Set this as SERVICE in the CodeBuild project env.
    Value: !GetAtt Service.Name

  LoadBalancerDNS:
    Description: ALB DNS name. CNAME your Cloudflare subdomain to THIS value.
    Value: !GetAtt LoadBalancer.DNSName

  LoadBalancerURL:
    Description: Stable public URL of the app (does not change between deploys).
    Value: !Sub "http://${LoadBalancer.DNSName}"

  MomentumScheduleName:
    Description: EventBridge schedule that runs recompute_momentum.
    Value: !Ref MomentumSchedule

  StaticBucketName:
    Description: S3 bucket holding collected static + media assets.
    Value: !Ref StaticBucket

  StaticBaseUrl:
    Description: Public base URL for assets (AWS_S3_CUSTOM_DOMAIN).
    Value: !Sub "https://${StaticBucket}.s3.${AWS::Region}.amazonaws.com/"
