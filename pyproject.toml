[tool.ruff]
# Lint + format in one tool (run via `make lint` / `make format` or the
# pre-commit hook). Django migrations are generated — never linted/formatted.
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) are the baseline; I (isort) adds import
# sorting. Keep this set achievable — widen deliberately, not all at once.
select = ["E", "W", "F", "I"]
# Line length is enforced by the FORMATTER (line-length above); the E501
# linter rule only nags about strings/URLs the formatter can't wrap.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports: unused imports in __init__ are intentional (e.g. the
# star-imported signals package).
"__init__.py" = ["F401"]
# Intentional `from … import *` (DRF status codes, honeypot views) — the
# star import is a deliberate idiom here, not a smell to autofix.
"app/rest/tags.py" = ["F403", "F405"]
"app/rest/threads.py" = ["F403", "F405"]
"honeypot/urls.py" = ["F403", "F405"]
# Tests routinely bind values they don't reference (fixtures created for
# their side effect) and use lambda helpers — noise to enforce there.
"app/tests/*" = ["F841", "E731"]

[tool.ruff.format]
# Black-compatible: double quotes, trailing commas, at line-length 120.
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
testpaths = ["app"]

[tool.coverage.run]
source = ["app", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/__init__.py",
    "manage.py",
    "core/wsgi.py",
    "core/asgi.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class Meta:",
]
show_missing = true
skip_covered = false
precision = 1
