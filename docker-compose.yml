services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: "${APP_NAME}_postgres"
    profiles: ["dev"]
    environment:
      - POSTGRES_USER=${DATABASE_USER:-}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-}
      - POSTGRES_DB=${DATABASE_NAME:-}
    ports:
      - ${DATABASE_PORT:-}:${DATABASE_PORT:-}
    command: -p ${DATABASE_PORT:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p ${DATABASE_PORT:-}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migration:
    container_name: "${APP_NAME}_migration"
    build:
      context: .
    profiles: ["dev"]
    command: python manage.py migrate --noinput
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - STAGE=${STAGE:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  collectstatic:
    container_name: "${APP_NAME}_collectstatic"
    build:
      context: .
    profiles: ["dev"]
    command: python manage.py collectstatic --noinput --clear
    environment:
      # Minimal env — collectstatic does not need DB connectivity.
      - SECRET_KEY=${SECRET_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - DEBUG=${DEBUG:-True}
      - STAGE=${STAGE:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-false}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-false}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
      - static_volume:/app/staticfiles
    networks:
      - internal

  web:
    container_name: "${APP_NAME}_django"
    restart: always
    build:
      context: .
    # Dev: runserver (autoreload). Prod (Raspberry): set WEB_COMMAND in
    # .env to serve with gunicorn (tuned config in gunicorn.conf.py):
    #   WEB_COMMAND=gunicorn core.wsgi:application -c gunicorn.conf.py -b 0.0.0.0:${SERVER_PORT}
    command: ${WEB_COMMAND:-python manage.py runserver 0.0.0.0:${SERVER_PORT:-}}
    tty: true
    expose:
      - ${SERVER_PORT:-}
    environment:
      # Database config — names that core/settings.py reads via python-decouple.
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      # Project config.
      - SERVER_PORT=${SERVER_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - INTERNAL_GRAPHQL_URL=${INTERNAL_GRAPHQL_URL:-}
      - STAGE=${STAGE:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      # Celery (to enqueue tasks from requests in the future).
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-pyamqp://guest:guest@rabbitmq:5672}
      # Media settings.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
      collectstatic:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: "${APP_NAME}_rabbitmq"
    restart: unless-stopped
    # No published ports: only services on the internal network talk to
    # the broker (web/worker). The management UI (15672) can be exposed
    # occasionally for debugging if needed.
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    container_name: "${APP_NAME}_worker"
    restart: always
    build:
      context: .
    # Worker + beat integrated in ONE container (-B): beat enqueues
    # recompute_momentum every 10 min (CELERY_BEAT_SCHEDULE in settings) and
    # the worker runs it. A single extra process, suitable for Raspberry.
    command: celery -A core worker -B -l info -Q celery --max-tasks-per-child=10
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - STAGE=${STAGE:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-pyamqp://guest:guest@rabbitmq:5672}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: "${APP_NAME}_nginx"
    restart: unless-stopped
    ports:
      - ${SERVER_PORT:-}:${SERVER_PORT:-}
    environment:
      - SERVER_PORT=${SERVER_PORT:-}
      - UPSTREAM_HOST=web
      - UPSTREAM_PORT=${SERVER_PORT:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  internal:
    driver: bridge
