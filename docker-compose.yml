services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: "${APP_NAME}_postgres"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-}
      - POSTGRES_DB=${DATABASE_NAME:-}
    ports:
      - ${DATABASE_PORT:-}:${DATABASE_PORT:-}
    command: -p ${DATABASE_PORT:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p ${DATABASE_PORT:-}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migration:
    container_name: "${APP_NAME}_migration"
    build:
      context: .
    command: python manage.py migrate --noinput
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    container_name: "${APP_NAME}_django"
    restart: always
    build:
      context: .
    # Local dev server (autoreload). Prod runs gunicorn via ci/aws.Dockerfile.
    command: python manage.py runserver 0.0.0.0:${SERVER_PORT:-}
    tty: true
    expose:
      - ${SERVER_PORT:-}
    environment:
      # Database config — names that core/settings.py reads via python-decouple.
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      # Project config.
      - SERVER_PORT=${SERVER_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - INTERNAL_GRAPHQL_URL=${INTERNAL_GRAPHQL_URL:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      # Media settings.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      # Upload-flow knobs (read/defaulted in core/settings.py). Numeric vars
      # carry a real default here: an EMPTY value would crash int() at startup
      # (decouple doesn't use its default when the var is present-but-empty).
      - UPLOAD_PRESIGN_EXPIRES=${UPLOAD_PRESIGN_EXPIRES:-600}
      # 100 MB (decimal) general hard cap (see .env.template; proxy must allow ≥ this).
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-100000000}
      # Captcha (Cap standalone — the `cap` service below). Real defaults:
      # empty values would crash the bool/int casts at startup. CAP_PORT is
      # the single local knob — settings.py derives both Cap URLs from it
      # (overridable with CAP_SITEVERIFY_URL / CAP_PUBLIC_URL for a remote Cap).
      - CAPTCHA_PROTECT=${CAPTCHA_PROTECT:-False}
      - CAPTCHA_PASS_TTL=${CAPTCHA_PASS_TTL:-600}
      - CAP_PORT=${CAP_PORT:-3333}
      - CAP_SITE_KEY=${CAP_SITE_KEY:-}
      - CAP_SECRET=${CAP_SECRET:-}
    volumes:
      - .:/app:Z
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  momentum:
    container_name: "${APP_NAME}_momentum"
    restart: unless-stopped
    build:
      context: .
    # Local stand-in for AWS EventBridge Scheduler: runs the management command
    # every 10 min (mirrors the prod cadence — each prod tick is a billed
    # ephemeral Fargate RunTask). Here it's a tiny sleep-loop so there is NO
    # broker (RabbitMQ) and NO always-on Celery worker. The recompute_momentum
    # command is self-contained — Celery only used to schedule it.
    command: >
      sh -c 'while true; do
               python manage.py recompute_momentum;
               sleep 600;
             done'
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  purge:
    container_name: "${APP_NAME}_purge"
    restart: unless-stopped
    build:
      context: .
    # Local stand-in for the purge_inactive EventBridge schedule: the garbage
    # collector runs every 2 days (mirrors the prod cadence), hard-deleting
    # soft-deleted rows and their storage objects in ONE batched request.
    # Same sleep-loop pattern as `momentum` — no broker, no always-on worker.
    command: >
      sh -c 'while true; do
               python manage.py purge_inactive;
               sleep 172800;
             done'
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  valkey:
    # Local Redis-compatible store. Used by `cap` only — Django never
    # touches it (the "no Redis" rule is about Django machinery).
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    container_name: "${APP_NAME}_valkey"
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  cap:
    # Official Cap standalone (https://github.com/tiagozip/cap): the FE
    # widget solves the invisible proof-of-work directly against it; the
    # backend only calls its /siteverify (see app/methods/captcha.py).
    # `web` deliberately does NOT depend on it — the app must boot with Cap
    # down (the human-pass layer fails closed at request time instead).
    # One-time setup: open http://localhost:${CAP_PORT}, log in with
    # CAP_ADMIN_KEY, create a key and paste CAP_SITE_KEY/CAP_SECRET in .env.
    image: tiago2/cap:latest
    restart: unless-stopped
    container_name: "${APP_NAME}_cap"
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY:-}
      # Cap's store: the local valkey by default; override REDIS_URL in
      # .env to point elsewhere. Site keys live in the store, not in env —
      # switching stores means re-creating the key.
      - REDIS_URL=${REDIS_URL:-redis://valkey:6379}
      # Cap's own listen-port knob: make the process bind CAP_PORT itself so
      # the container, the published port and the startup log all agree.
      - SERVER_PORT=${CAP_PORT:-3333}
    ports:
      # Browser-facing (widget + admin dashboard). Django talks to it over
      # the internal network (http://cap:CAP_PORT — derived in settings.py).
      - ${CAP_PORT:-3333}:${CAP_PORT:-3333}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: "${APP_NAME}_nginx"
    restart: unless-stopped
    ports:
      - ${SERVER_PORT:-}:${SERVER_PORT:-}
    environment:
      - SERVER_PORT=${SERVER_PORT:-}
      - UPSTREAM_HOST=web
      - UPSTREAM_PORT=${SERVER_PORT:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:
  valkey_data:

networks:
  internal:
    driver: bridge
