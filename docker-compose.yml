services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: "${APP_NAME}_postgres"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-}
      - POSTGRES_DB=${DATABASE_NAME:-}
    ports:
      - ${DATABASE_PORT:-}:${DATABASE_PORT:-}
    command: -p ${DATABASE_PORT:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p ${DATABASE_PORT:-}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migration:
    container_name: "${APP_NAME}_migration"
    build:
      context: .
    command: python manage.py migrate --noinput
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    container_name: "${APP_NAME}_django"
    restart: always
    build:
      context: .
    # Local dev server (autoreload). Prod runs gunicorn via ci/aws.Dockerfile.
    command: python manage.py runserver 0.0.0.0:${SERVER_PORT:-}
    tty: true
    expose:
      - ${SERVER_PORT:-}
    environment:
      # Database config — names that core/settings.py reads via python-decouple.
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      # Project config.
      - SERVER_PORT=${SERVER_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - INTERNAL_GRAPHQL_URL=${INTERNAL_GRAPHQL_URL:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      # Media settings.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-}
      - AWS_S3_CUSTOM_DOMAIN=${AWS_S3_CUSTOM_DOMAIN:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
      # Upload-flow knobs (read/defaulted in core/settings.py). Numeric vars
      # carry a real default here: an EMPTY value would crash int() at startup
      # (decouple doesn't use its default when the var is present-but-empty).
      - UPLOAD_PRESIGN_EXPIRES=${UPLOAD_PRESIGN_EXPIRES:-600}
      # 512 MB general hard cap (see .env.template; proxy must allow ≥ this).
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-536870912}
    volumes:
      - .:/app:Z
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  momentum:
    container_name: "${APP_NAME}_momentum"
    restart: unless-stopped
    build:
      context: .
    # Local stand-in for AWS EventBridge Scheduler: runs the management command
    # every 10 min. In AWS this is an ephemeral Fargate RunTask; here it's a
    # tiny sleep-loop so there is NO broker (RabbitMQ) and NO always-on Celery
    # worker. The recompute_momentum command is self-contained — Celery only
    # used to schedule it.
    command: >
      sh -c 'while true; do
               python manage.py recompute_momentum;
               sleep 600;
             done'
    environment:
      - DATABASE_ENGINE=${DATABASE_ENGINE:-}
      - DATABASE_HOST=${DATABASE_HOST:-}
      - DATABASE_NAME=${DATABASE_NAME:-}
      - DATABASE_USER=${DATABASE_USER:-}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-}
      - DATABASE_PORT=${DATABASE_PORT:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - GATEWAY_SEED=${GATEWAY_SEED:-}
      - DEBUG=${DEBUG:-}
      - ENCRYPTED_RESPONSE=${ENCRYPTED_RESPONSE:-}
      - SINGLE_REQUEST_PROTECT=${SINGLE_REQUEST_PROTECT:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - INTERNAL_ADMIN_URL=${INTERNAL_ADMIN_URL:-}
      - USE_AWS_STORAGE_SYSTEM=${USE_AWS_STORAGE_SYSTEM:-}
      - USE_AWS_STORAGE=${USE_AWS_STORAGE_SYSTEM:-}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-}
    volumes:
      - .:/app:Z
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migration:
        condition: service_completed_successfully
        required: false
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: "${APP_NAME}_nginx"
    restart: unless-stopped
    ports:
      - ${SERVER_PORT:-}:${SERVER_PORT:-}
    environment:
      - SERVER_PORT=${SERVER_PORT:-}
      - UPSTREAM_HOST=web
      - UPSTREAM_PORT=${SERVER_PORT:-}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  internal:
    driver: bridge
